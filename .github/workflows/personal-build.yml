name: Personal Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Test notch navigation
        run: node --test tests/notchNavigation.test.mjs
      - name: Test Start menu placement
        shell: pwsh
        run: |
          rustc --test src-tauri/src/start_menu_geometry.rs -o start-menu-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./start-menu-tests.exe
      - name: Build Windows executable
        run: bun run tauri build --no-bundle
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Nectar-personal-Windows-x64
          path: src-tauri/target/release/nectar.exe
          if-no-files-found: error
